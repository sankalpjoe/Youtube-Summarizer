<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f2f6" />
  
  <!-- Streamlit sidebar -->
  <rect x="0" y="0" width="240" height="600" fill="#ffffff" stroke="#e6e9ef" stroke-width="1" />
  
  <!-- Sidebar header -->
  <rect x="0" y="0" width="240" height="50" fill="#f63366" />
  <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="white">Options</text>
  
  <!-- Sidebar content -->
  <text x="20" y="80" font-family="Arial" font-size="14" fill="#262730">Maximum summary length</text>
  <rect x="20" y="90" width="200" height="20" rx="10" ry="10" fill="#e6e9ef" />
  <circle cx="120" cy="100" r="8" fill="#f63366" />
  
  <text x="20" y="130" font-family="Arial" font-size="14" fill="#262730">Minimum summary length</text>
  <rect x="20" y="140" width="200" height="20" rx="10" ry="10" fill="#e6e9ef" />
  <circle cx="70" cy="150" r="8" fill="#f63366" />
  
  <line x1="20" y1="180" x2="220" y2="180" stroke="#e6e9ef" stroke-width="1" />
  <text x="20" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#262730">Additional Analysis</text>
  
  <!-- Checkboxes -->
  <rect x="20" y="220" width="16" height="16" fill="#f63366" />
  <text x="45" y="233" font-family="Arial" font-size="14" fill="#262730">Sentiment Analysis</text>
  
  <rect x="20" y="250" width="16" height="16" fill="#f63366" />
  <text x="45" y="263" font-family="Arial" font-size="14" fill="#262730">Topic Extraction</text>
  
  <rect x="20" y="280" width="16" height="16" fill="#f63366" />
  <text x="45" y="293" font-family="Arial" font-size="14" fill="#262730">Generate Visualizations</text>
  
  <!-- Main content area -->
  <rect x="240" y="0" width="560" height="600" fill="#f0f2f6" />
  
  <!-- Header -->
  <text x="270" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#262730">🎥 YouTube Transcript Summarizer</text>
  <text x="270" y="70" font-family="Arial" font-size="14" fill="#262730">This app uses AI to extract, analyze, and summarize YouTube video transcripts.</text>
  
  <!-- URL input form -->
  <rect x="270" y="100" width="500" height="120" rx="4" ry="4" fill="white" stroke="#e6e9ef" stroke-width="1" />
  <text x="290" y="130" font-family="Arial" font-size="16" fill="#262730">Enter a YouTube video URL:</text>
  <rect x="290" y="140" width="460" height="36" rx="4" ry="4" fill="white" stroke="#e6e9ef" stroke-width="1" />
  <text x="300" y="164" font-family="Arial" font-size="14" fill="#9c9c9c">https://www.youtube.com/watch?v=...</text>
  <rect x="290" y="190" width="120" height="36" rx="4" ry="4" fill="#f63366" />
  <text x="310" y="213" font-family="Arial" font-size="14" font-weight="bold" fill="white">Process Video</text>
  
  <!-- Processing status -->
  <text x="270" y="260" font-family="Arial" font-size="18" font-weight="bold" fill="#262730">Processing Status</text>
  
  <!-- Progress indicators -->
  <rect x="270" y="280" width="125" height="60" rx="4" ry="4" fill="#09ab3b" />
  <text x="290" y="315" font-family="Arial" font-size="12" font-weight="bold" fill="white">URL Validated</text>
  
  <rect x="405" y="280" width="125" height="60" rx="4" ry="4" fill="#09ab3b" />
  <text x="417" y="315" font-family="Arial" font-size="12" font-weight="bold" fill="white">Transcript Extracted</text>
  
  <rect x="540" y="280" width="125" height="60" rx="4" ry="4" fill="#09ab3b" />
  <text x="552" y="315" font-family="Arial" font-size="12" font-weight="bold" fill="white">Analysis Complete</text>
  
  <rect x="675" y="280" width="125" height="60" rx="4" ry="4" fill="#09ab3b" />
  <text x="688" y="315" font-family="Arial" font-size="12" font-weight="bold" fill="white">Summary Generated</text>
  
  <!-- Results section -->
  <line x1="270" y1="360" x2="770" y2="360" stroke="#e6e9ef" stroke-width="1" />
  <text x="270" y="390" font-family="Arial" font-size="20" font-weight="bold" fill="#262730">Results</text>
  
  <!-- Tabs -->
  <rect x="270" y="400" width="500" height="40" fill="white" stroke="#e6e9ef" stroke-width="1" />
  <rect x="270" y="400" width="125" height="40" fill="#f63366" />
  <text x="315" y="425" font-family="Arial" font-size="14" font-weight="bold" fill="white">Summary</text>
  <text x="440" y="425" font-family="Arial" font-size="14" fill="#262730">Transcript</text>
  <text x="540" y="425" font-family="Arial" font-size="14" fill="#262730">Analysis</text>
  <text x="640" y="425" font-family="Arial" font-size="14" fill="#262730">Visualizations</text>
  
  <!-- Summary content -->
  <rect x="270" y="440" width="500" height="140" rx="4" ry="4" fill="white" stroke="#e6e9ef" stroke-width="1" />
  <text x="290" y="470" font-family="Arial" font-size="16" font-weight="bold" fill="#262730">Video Summary</text>
  <text x="290" y="500" font-family="Arial" font-size="14" fill="#262730">This is a summary of the YouTube video content. The AI has analyzed</text>
  <text x="290" y="520" font-family="Arial" font-size="14" fill="#262730">the transcript and extracted the most important points to provide this</text>
  <text x="290" y="540" font-family="Arial" font-size="14" fill="#262730">concise overview of what was discussed in the video.</text>
  
  <!-- Download button -->
  <rect x="290" y="560" width="150" height="36" rx="4" ry="4" fill="#f0f2f6" stroke="#e6e9ef" stroke-width="1" />
  <text x="320" y="583" font-family="Arial" font-size="14" fill="#262730">Download Summary</text>
</svg>
